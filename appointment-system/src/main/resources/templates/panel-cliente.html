<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel del Cliente</title>
    <link rel="stylesheet" href="/css/index.css">

    <!-- Bootstrap 5.1.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome (Famicón) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="fas fa-cut"></i> Rossy
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="navbar-nav ms-auto align-items-center">
                <a class="nav-link" href="/citas/agendar">Agendar Cita</a>
                <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm ms-3">Cerrar sesión</a>
            </div>
        </div>
    </div>
</nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h2 class="mb-0">
                            <i class="fas fa-user"></i> Bienvenido, <span th:text="${cliente.nombre}">Cliente</span>
                        </h2>
                    </div>
                    <div class="card-body">
                        <h4 class="mb-4"><i class="fas fa-edit"></i> Editar Perfil</h4>
                        <form th:action="@{/panel}" th:object="${cliente}" method="post">
                            <input type="hidden" th:field="*{id}">

                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-user"></i> Nombre:</label>
                                <input type="text" th:field="*{nombre}" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-user-tag"></i> Apellido:</label>
                                <input type="text" th:field="*{apellido}" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-envelope"></i> Email:</label>
                                <input type="email" th:field="*{email}" class="form-control" required readonly>
                            </div>

                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-phone"></i> Teléfono:</label>
                                <input type="text" th:field="*{telefono}" class="form-control" required>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-success">
                                    <i class="fas fa-save"></i> Guardar cambios
                                </button>
                            </div>
                        </form>

                        <div th:if="${mensaje}" class="alert alert-info mt-3" th:text="${mensaje}"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle (incluye Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

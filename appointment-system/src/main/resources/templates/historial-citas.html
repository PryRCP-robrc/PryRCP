<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Historial de Citas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #f1f5f9;
        }

        .card {
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
            transition: transform 0.2s ease-in-out;
            margin-bottom: 1.5rem;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.18);
        }

        .card-header {
            background: linear-gradient(90deg, #4e9af1 0%, #2a6bdb 100%);
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            border-radius: 12px 12px 0 0;
            padding: 0.75rem 1rem;
        }

        h6 {
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: #334155;
        }

        .text-primary {
            font-weight: 700;
        }

        .code-box {
            background-color: #e0e7ff;
            border-radius: 8px;
            padding: 0.6rem 1rem;
            box-shadow: inset 0 0 6px #c7d2fe;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.2rem;
            letter-spacing: 0.1em;
            user-select: all;
            margin-bottom: 0.25rem;
        }

        .badge {
            font-size: 1rem;
            padding: 0.35em 0.7em;
            border-radius: 20px;
            text-transform: capitalize;
        }

        .btn-primary {
            background: #2a6bdb;
            border: none;
            transition: background-color 0.3s ease;
            font-size: 0.9rem;
            padding: 0.4rem 1.2rem;
        }

        .btn-primary:hover {
            background: #1e4fa1;
        }

        .btn-outline-primary {
            border-color: #2a6bdb;
            color: #2a6bdb;
            transition: background-color 0.3s ease, color 0.3s ease;
            font-size: 0.9rem;
            padding: 0.4rem 1.2rem;
        }

        .btn-outline-primary:hover {
            background-color: #2a6bdb;
            color: white;
        }

        .no-citas {
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            padding: 20px;
            border-radius: 12px;
            font-size: 1.1rem;
            color: #664d03;
            max-width: 500px;
            margin: 3rem auto;
            box-shadow: 0 4px 15px rgba(255, 193, 7, 0.3);
        }
    </style>
</head>
<body>

<div class="container mt-5 mb-5">
    <h2 class="mb-5 text-center fw-bold text-secondary">Historial de Citas</h2>

    <div th:if="${#lists.isEmpty(citas)}" class="no-citas text-center">
        <i class="bi bi-exclamation-circle fs-2 mb-2"></i>
        <p class="mb-0">No hay citas registradas.</p>
    </div>

    <div class="row">
        <div th:each="cita : ${citas}" class="col-md-6">
            <div class="card h-100">
                <div class="card-header">
                    <i class="bi bi-calendar-check-fill me-2"></i> Cita Confirmada
                </div>
                <div class="card-body px-4 py-3">

                    <!-- Código de la cita -->
                    <div class="mb-3">
                        <h6>Código de tu cita:</h6>
                        <div class="code-box" th:text="${cita.codigoUnico}">ABC123</div>
                        <small class="text-muted">Guarda este código para verificar tu cita</small>
                    </div>

                    <!-- Detalles del cliente y peluquero -->
                    <div class="row mb-3">
                        <div class="col-6">
                            <h6><i class="bi bi-person-fill me-1 text-primary"></i> Cliente:</h6>
                            <p class="text-secondary fs-6 mb-2" th:text="${cita.cliente.nombre + ' ' + cita.cliente.apellido}">Nombre Cliente</p>

                            <h6><i class="bi bi-scissors me-1 text-primary"></i> Peluquero:</h6>
                            <p class="text-secondary fs-6 mb-0" th:text="${cita.peluquero.nombre + ' ' + cita.peluquero.apellido}">Nombre Peluquero</p>
                        </div>
                        <div class="col-6">
                            <h6><i class="bi bi-calendar-event me-1 text-primary"></i> Fecha y Hora:</h6>
                            <p class="text-secondary fs-6 mb-2" th:text="${#temporals.format(cita.fechaHora, 'dd/MM/yyyy HH:mm')}">21/07/2025 14:30</p>

                            <h6><i class="bi bi-info-circle me-1 text-primary"></i> Estado:</h6>
                            <span class="badge bg-success" th:text="${cita.estado}">Confirmada</span>
                        </div>
                    </div>


                    

                    <!-- Botones -->
                    <div class="d-flex gap-2 justify-content-center">
                        <a th:href="@{'/citas/comprobante/' + ${cita.codigoUnico}}" class="btn btn-primary btn-sm px-3">
                            <i class="bi bi-download me-1"></i> Descargar PDF
                        </a>
                        <a href="/" class="btn btn-outline-primary btn-sm px-3">
                            <i class="bi bi-house me-1"></i> Inicio
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
